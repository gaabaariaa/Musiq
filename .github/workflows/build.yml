name: Build and Package

on:
  push:
    branches: [ main, musiq-foundation ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Musiq.sln
      - run: dotnet build Musiq.sln --configuration Release --no-restore
      - run: dotnet test Musiq.sln --configuration Release --no-build

      - name: Publish Windows x64 executable
        run: dotnet publish src/Musiq.App/Musiq.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload Windows installer executable
        uses: actions/upload-artifact@v4
        with:
          name: Musiq-Windows-x64
          path: publish/Musiq.App.exe
          if-no-files-found: error
