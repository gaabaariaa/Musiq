name: Build and Package

on:
  push:
    branches: [ main, musiq-foundation ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Musiq.sln

      - name: Build
        run: dotnet build Musiq.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Musiq.sln --configuration Release --no-build

      - name: Publish Windows x64
        run: dotnet publish src/Musiq.App/Musiq.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Musiq-Windows-x64
          path: publish/*.exe
          if-no-files-found: error
